name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No database drivers and no credentials: lint, dry-run and the whole
      # test suite are meant to work on a bare image. If this step needs more,
      # something has leaked a dependency it should not have.
      - name: Install
        run: pip install -e '.[dev]'

      - name: Test
        run: pytest

      - name: Lint the migration SQL
        run: python -m snowshift.cli lint sql/ --severity error

      - name: Plan the deployment
        run: python -m snowshift.cli deploy --dry-run --include-optional

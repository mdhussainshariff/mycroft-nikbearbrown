[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snowshift"
version = "0.2.0"
description = "Lint, deploy and verify a SQL Server to Snowflake migration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohammed Hussain Shariff" }]
keywords = ["snowflake", "sql-server", "migration", "tsql", "data-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
]

# The base install stays light on purpose: `snowshift lint` and
# `snowshift deploy --dry-run` must work on a machine with no database drivers.
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
deploy = ["snowflake-connector-python>=3.0"]
parity = ["snowflake-connector-python>=3.0", "pyodbc>=5.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
snowshift = "snowshift.cli:main"

[project.urls]
Homepage = "https://github.com/mdhussainshariff/snowshift"
Issues = "https://github.com/mdhussainshariff/snowshift/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

services:
  gatekeeper:
    build: .
    container_name: provenance-gatekeeper
    ports:
      - "8000:8000"
    volumes:
      # Your existing mappings
      - ./data:/code/data
      - ./chroma_db:/code/chroma_db
      # CRITICAL: Mount your root SQLite database so it persists in the cloud
      - ./gatekeeper_logs.db:/code/gatekeeper_logs.db
    environment:
      - ENVIRONMENT=production
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3